[package]
name = "taskmap"
version = "0.3.4"
description = "TaskMap desktop prototype"
authors = ["TaskMap"]
edition = "2021"

[features]
default = []
mcp-development = ["dep:tauri-plugin-mcp-bridge"]
storage-free-preview = []

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
argon2 = { version = "0.5.3", features = ["zeroize"] }
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
fs2 = "0.4.3"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "webp",
] }
webp = "0.3"
rand = "0.8.5"
rusqlite = { version = "0.32.1", features = ["backup", "bundled"] }
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
tauri = { version = "2.5.0", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-mcp-bridge = { version = "=0.12.0", optional = true }
tauri-plugin-opener = "2.2.6"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
thiserror = "2.0"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
tempfile = "3.20"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Same versions Tauri's WebView2 backend already uses; only for turning off WebView2 autofill.
webview2-com = "0.38.2"
windows-core = "0.61.2"

# Unoptimized Argon2id (64 MiB, 3 passes) made every dev unlock take ~2.5 s. Optimize only the
# crypto crates in dev builds; release builds are unaffected.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.chacha20]
opt-level = 3

[profile.dev.package.poly1305]
opt-level = 3

[profile.dev.package.chacha20poly1305]
opt-level = 3
