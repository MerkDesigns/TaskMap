[package]
name = "taskmap"
version = "0.1.6"
description = "TaskMap desktop prototype"
authors = ["TaskMap"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.22.1"
discord-rich-presence = "1.1.0"
keyring = { version = "3.6.2", default-features = false, features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
pbkdf2 = "0.12.2"
rand = "0.8.5"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
tauri = { version = "2.5.0", features = [] }
tauri-plugin-opener = "2.2.6"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
