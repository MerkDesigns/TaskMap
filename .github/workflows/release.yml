name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-tauri:
    runs-on: windows-latest

    steps:
      # Installed legacy TaskMap builds update themselves to the latest release of this repository and
      # cannot open new-architecture data. Remove this step only when the legacy migrator ships
      # (REFACTOR-ROADMAP Phase 9) and the release version is 1.0.0 or later.
      - name: Refuse new-architecture releases before the legacy migrator exists
        shell: pwsh
        run: |
          Write-Error "Publishing a new-architecture release would auto-update installed legacy TaskMap builds. See docs/REFACTOR-STATE.md."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npm run tauri
          tagName: ${{ github.ref_name }}
          releaseName: TaskMap ${{ github.ref_name }}
          releaseBody: |
            Desktop release for TaskMap.

            Installers and updater metadata are attached to this GitHub Release.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
