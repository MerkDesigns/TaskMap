name: CI

on:
  push:
    branches:
      - main
      - architecture-v1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Check code map
        run: npm run codemap:check

  rust:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [default, development, all-features]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust
        shell: pwsh
        run: |
          $featureArgs = @()
          if ('${{ matrix.edition }}' -eq 'development') {
            $featureArgs = @('--features', 'phase2-development,mcp-development')
          }
          if ('${{ matrix.edition }}' -eq 'all-features') {
            $featureArgs = @('--all-features')
          }
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets @featureArgs -- -D warnings

      - name: Test Rust
        shell: pwsh
        run: |
          $featureArgs = @()
          if ('${{ matrix.edition }}' -eq 'development') {
            $featureArgs = @('--features', 'phase2-development,mcp-development')
          }
          if ('${{ matrix.edition }}' -eq 'all-features') {
            $featureArgs = @('--all-features')
          }
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets @featureArgs
