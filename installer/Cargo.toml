[package]
name = "taskmap-installer"
version = "0.1.0"
description = "TaskMap installer: a custom setup UI around the embedded NSIS installer"
authors = ["TaskMap"]
edition = "2021"

[features]
default = []
mcp-development = ["dep:tauri-plugin-mcp-bridge"]

[build-dependencies]
serde_json = "1.0"
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.5.0", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-mcp-bridge = { version = "=0.12.0", optional = true }
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.20"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }

[profile.release]
# A small installer download matters more than build time.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
